name: New Language Implementation
description: Propose or contribute an implementation in a new language
title: "[Language]: "
labels: ["enhancement", "multi-language"]
body:
  - type: markdown
    attributes:
      value: |
        Interested in porting BMSSP to a new language? Great! Please provide the details below.

  - type: input
    id: language
    attributes:
      label: Language
      description: Which language are you proposing?
      placeholder: e.g., Python, C++, Haskell, Zig
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: Status
      description: Where are you with this implementation?
      options:
        - Proposal only (looking for interest)
        - In progress (partial implementation)
        - Ready for review (complete draft)
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details
      description: |
        Describe your approach. Which components are implemented (FindPivots, BaseCase, BMSSP, DQueue)?
        Are there language-specific trade-offs?
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: Implements FindPivots
        - label: Implements BaseCase
        - label: Implements BMSSP (main solver)
        - label: Implements DQueue
        - label: Includes tests
        - label: Includes language-specific README
