name: Benchmarks

on:
  push:
    branches: [main]
    paths:
      - "implementations/**"
      - "benchmarks/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Performance comparison
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Install benchmark dependencies
        run: pip install -r benchmarks/requirements.txt

      - name: Run benchmarks
        run: python benchmarks/performance_comparison.py
        timeout-minutes: 30

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: |
            benchmarks/results/
            benchmarks/PERFORMANCE_REPORT.md
            benchmarks/performance_analysis.png
          retention-days: 30
