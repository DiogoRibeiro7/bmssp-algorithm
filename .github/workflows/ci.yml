name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementations/go
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache-dependency-path: implementations/go/go.sum
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v6
        with:
          working-directory: implementations/go
      - run: go test -v -race -coverprofile=coverage.out ./...
      - name: Report coverage
        run: go tool cover -func=coverage.out
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: implementations/go/coverage.out

  c:
    name: C
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementations/c
    steps:
      - uses: actions/checkout@v6
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y clang-format cppcheck
      - name: clang-format check
        run: clang-format --dry-run --Werror bmssp.c
        continue-on-error: true
      - name: cppcheck
        run: cppcheck --enable=warning --suppress=missingIncludeSystem --error-exitcode=1 bmssp.c
        continue-on-error: true
      - name: Compile
        run: gcc -Wall -Wextra -std=c11 bmssp.c -lm -o bmssp
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest tests/ -v

  rust:
    name: Rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementations/rust
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: implementations/rust
      - run: cargo fmt --check
      - run: cargo build --verbose
      - run: cargo test --verbose
      - run: cargo clippy -- -D warnings
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin
      - name: Generate coverage
        run: cargo tarpaulin --out xml --output-dir coverage/
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: implementations/rust/coverage/cobertura.xml

  java:
    name: Java
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementations/java
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compile
        run: javac BMSSP.java BMSSPTest.java
      - name: Run tests
        run: java BMSSPTest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest tests/ -v

  fortran:
    name: Fortran
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementations/fortran
    steps:
      - uses: actions/checkout@v6
      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Compile
        run: gfortran -Wall -Wextra -std=f2008 bmssp.f90 -o bmssp
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest tests/ -v

  julia:
    name: Julia
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementations/julia
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.9"
      - uses: julia-actions/cache@v2
      - name: Install dependencies
        run: julia -e 'using Pkg; Pkg.activate("BMSSPAlgorithm"); Pkg.instantiate(); Pkg.add("JuliaFormatter")'
      - name: Check formatting
        run: |
          julia -e 'using JuliaFormatter; exit(format("BMSSPAlgorithm/src", overwrite=false) ? 0 : 1)'
      - name: Run tests
        run: julia tests/test_bmssp.jl

  cross-language:
    name: Cross-language validation
    runs-on: ubuntu-latest
    needs: [go, c, rust, java, fortran, julia]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache-dependency-path: implementations/go/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: implementations/rust
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.9"
      - name: Install Julia dependencies
        run: julia -e 'using Pkg; Pkg.activate("implementations/julia/BMSSPAlgorithm"); Pkg.instantiate()'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run cross-language validation
        run: python tests/cross_language_validation.py
